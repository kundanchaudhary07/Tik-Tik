name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_productivity_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/test_productivity_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_ci_environment_32_bytes_minimum_length
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/test_productivity_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_ci_environment_32_bytes_minimum_length
          ENVIRONMENT: test
        run: |
          pytest backend/tests/ -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Dist Artifacts
        run: |
          test -d dist
          test -f dist/index.html

  docker-build-verification:
    name: Production Docker Build Check
    runs-on: ubuntu-latest
    needs: [ lint-and-typecheck, backend-tests, frontend-build ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: productivity-frontend:ci-test

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: docker/backend.Dockerfile
          push: false
          tags: productivity-backend:ci-test

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: docker/worker.Dockerfile
          push: false
          tags: productivity-worker:ci-test
