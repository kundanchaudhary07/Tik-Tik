name: Production Continuous Deployment (CD)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write # Required for AWS OIDC Identity Federation
  contents: read

jobs:
  pre-deployment-checks:
    name: Run Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Build
        run: |
          npm ci || npm install
          npx tsc --noEmit
          npm run build

  deploy-production:
    name: Deploy to AWS ECS & S3/CloudFront
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          echo "SHA=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      # 1. Secure Authentication via AWS OIDC (No static access keys in YAML)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 2. Build and Push Immutable Docker Images
      - name: Build and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: productivity-backend
          IMAGE_TAG: ${{ steps.version.outputs.TAG }}
          COMMIT_SHA: ${{ steps.version.outputs.SHA }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA ./backend -f docker/backend.Dockerfile
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA

      - name: Build and Push Worker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: productivity-worker
          IMAGE_TAG: ${{ steps.version.outputs.TAG }}
          COMMIT_SHA: ${{ steps.version.outputs.SHA }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA ./backend -f docker/worker.Dockerfile
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA

      # 3. Step 8: Database Migration Gate (Run before service swap)
      - name: Run Database Migrations on Managed RDS
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
        run: |
          echo "Triggering isolated Alembic migration one-off task on ECS..."
          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition productivity-db-migration \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNETS }}],securityGroups=[${{ secrets.ECS_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          
          echo "Waiting for database migration task $TASK_ARN to complete..."
          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN
          
          EXIT_CODE=$(aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks $TASK_ARN --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "DATABASE MIGRATION FAILED WITH EXIT CODE $EXIT_CODE! ABORTING DEPLOYMENT."
            exit 1
          fi
          echo "Database migration completed successfully."

      # 4. Zero-Downtime Rolling Update to ECS Fargate Services
      - name: Update ECS API Service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service productivity-api \
            --force-new-deployment

      - name: Update ECS Background Worker Service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service productivity-worker \
            --force-new-deployment

      # 5. Deploy Frontend to Amazon S3 & Invalidate CloudFront CDN
      - name: Build & Sync Static Frontend Bundle
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          npm ci || npm install
          npm run build
          aws s3 sync dist/ s3://${{ secrets.FRONTEND_S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # 6. Post-Deployment ALB Health Check & Rollback Safeguard
      - name: Verify Post-Deployment Health Check
        run: |
          HEALTH_URL="${{ secrets.PRODUCTION_API_URL }}/health/ready"
          echo "Polling $HEALTH_URL for readiness..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || true)
            if [ "$STATUS" = "200" ]; then
              echo "Production API is healthy (HTTP 200)."
              exit 0
            fi
            echo "Waiting for health check... (Attempt $i, status: $STATUS)"
            sleep 10
          done
          echo "DEPLOYMENT FAILED: Health check timed out or returned error. Triggering rollback!"
          exit 1

      # 7. Automated Rollback Handler if Health Check or Deployment Fails
      - name: Execute Automated Rollback
        if: failure()
        run: |
          echo "ALERT: Deployment failure detected. Rolling back ECS services to previous stable task definition..."
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service productivity-api \
            --task-definition productivity-api:PREVIOUS \
            --force-new-deployment
          
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service productivity-worker \
            --task-definition productivity-worker:PREVIOUS \
            --force-new-deployment
          echo "Rollback instruction issued."
